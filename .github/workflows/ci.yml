name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=betti-coaching
      - run: npm test --workspace=betti-coaching
      - run: npm run build --workspace=betti-coaching
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=betti-coaching
