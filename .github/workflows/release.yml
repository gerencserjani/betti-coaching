name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Release every coach app
        shell: bash
        run: |
          set -e
          for app_dir in apps/*/; do
            if [ -f "${app_dir}release.config.js" ]; then
              app="${app_dir%/}"
              app="${app#apps/}"
              echo "::group::Releasing $app"
              (cd "$app_dir" && npx semantic-release)
              echo "::endgroup::"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
